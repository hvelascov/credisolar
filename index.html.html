function clienteStats(c) {

  const montoPagado = montoCompletos + montoParcial + c.enganche;
  const montoRestante = c.pagos.filter((p) => !p.pagado).reduce((s, p) => s + (p.saldoPendiente ?? p.monto), 0);
  const vencidos = c.pagos.filter((p) => !p.pagado && pagoStatus(p).dias !== null && pagoStatus(p).dias < 0).length;

  return { montoRestante, montoPagado, vencidos, proximos, pct, parciales };
}
